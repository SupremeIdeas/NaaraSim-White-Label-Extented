<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naara Dashboard System (Core 13) — V9 · Surface</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ NAARA SURFACE TOKENS v3 ============
 Rules: 3 neutral steps (canvas < surface < surface2) + 1 line. Colour is spent in three places only:
 teal = the primary action (Verify), gold = money committed, and one tone-tint per bento card. */
:root{
 --canvas:3 17 30; --canvas2:4 25 40; --surface:8 32 47; --surface2:11 41 58; --surface3:16 54 72;
 --line:23 68 82; --line-strong:36 110 122; --hi:255 255 255;
 --text:234 244 248; --text2:158 184 199; --text3:118 147 165;
 --teal:16 181 174; --cta-a:16 179 170; --cta-b:6 128 124; --teal-ink:61 219 208;
 --gold:242 185 59; --gold2:226 152 8; --gold-ink:242 185 59; --on-gold:38 28 0;
 --ok:52 211 153; --warn:242 185 59; --acc-a:15 169 164; --acc-b:6 118 128; --acc-c:4 84 99;
 --e1:0 14px 30px -20px rgb(0 0 0/.75); --e2:0 -24px 60px -24px rgb(0 0 0/.7);
 --r-card:24px; --r-sheet:30px; --r-row:18px; --font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[data-theme=light]{
 --canvas:235 242 244; --canvas2:244 248 249; --surface:255 255 255; --surface2:244 248 249; --surface3:230 239 242;
 --line:213 227 231; --line-strong:160 195 203; --hi:255 255 255;
 --text:10 36 49; --text2:70 96 109; --text3:88 114 127;
 --teal:10 155 148; --cta-a:12 158 150; --cta-b:5 118 114; --teal-ink:0 127 121;
 --gold-ink:133 92 0; --warn:133 92 0; --ok:4 120 87;
 --e1:0 10px 26px -18px rgb(10 36 49/.3); --e2:0 -14px 44px -18px rgb(10 36 49/.3);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#070d14;color:#dbe6ee;display:flex;flex-direction:column;align-items:center;overflow:hidden}
[data-theme=light] body{background:#d9e4e8;color:#0a2431}
button,input{font:inherit;color:inherit;background:none;border:0}button{cursor:pointer;text-align:left}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid rgb(var(--teal-ink));outline-offset:2px}
.hide{display:none!important}

/* review bar (not part of app) */
.bar{flex:none;width:100%;max-width:560px;display:flex;gap:6px;padding:10px;overflow-x:auto;scrollbar-width:none;justify-content:safe center;font-size:13px}
.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;padding:7px 12px;border-radius:99px;border:1px solid rgb(128 150 165/.4);background:rgb(128 150 165/.12);white-space:nowrap}
.bar button.on{background:#0a9b94;border-color:#0a9b94;color:#fff}
.bar .sep{width:1px;background:rgb(128 150 165/.4);flex:none}

/* ============ APP SHELL (fits any width/height) ============ */
.app{flex:1;min-height:0;width:100%;max-width:430px;margin-bottom:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;container-type:inline-size;
 border-radius:34px;border:1px solid rgb(var(--line));color:rgb(var(--text));
 background:radial-gradient(120% 40% at 50% 0,rgb(var(--teal)/.1),transparent 70%),linear-gradient(rgb(var(--canvas2)),rgb(var(--canvas)) 320px)}
@media (max-width:520px){.app{max-width:none;border-radius:0;border-inline:0;border-bottom:0;margin-bottom:0}}
@media (min-width:521px){.app{max-height:860px}}
.hdr{flex:none;display:flex;align-items:center;gap:6px;padding:12px 14px 8px}
.logo{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(19px,6cqw,23px);letter-spacing:-.4px;white-space:nowrap}
.logo b{color:#F26B1D;font-weight:700}.mark{width:30px;height:30px;border-radius:10px;flex:none;background:conic-gradient(from 210deg,#10b5ae,#f2b93b,#f26b1d,#10b5ae)}
.hb{position:relative;width:40px;height:40px;display:grid;place-items:center;font-size:22px;border-radius:14px}
.hb .dot{position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:rgb(var(--gold));color:rgb(var(--on-gold));font-size:10px;font-weight:700;display:grid;place-items:center}
.tog{width:50px;height:28px;flex:none;border-radius:99px;background:rgb(var(--surface3));border:1px solid rgb(var(--line));padding:2px;display:flex}.tog i{width:22px;height:22px;border-radius:50%;background:rgb(var(--gold))}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;z-index:1}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px 20px;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgb(var(--surface));border-top:1px solid rgb(var(--line));position:relative;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:rgb(var(--text3));position:relative;padding:2px 0}
.nav .i{font-size:23px}.nav button.on{color:rgb(var(--teal-ink))}
.nav .mid{justify-self:center;width:54px;height:54px;margin-top:-24px;border-radius:50%;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,rgb(var(--cta-a)),rgb(var(--cta-b)));box-shadow:0 0 0 5px rgb(var(--canvas)),0 10px 20px -8px rgb(var(--teal)/.7)}
.nav .soon:after{content:"Soon";position:absolute;top:-9px;left:54%;font-size:9px;font-weight:700;background:rgb(var(--gold));color:rgb(var(--on-gold));padding:1px 6px;border-radius:9px}

/* ============ PRIMITIVES ============ */
.h1{font-size:clamp(22px,7cqw,27px);font-weight:600;letter-spacing:-.5px;line-height:1.15}.sub{font-size:14px;color:rgb(var(--text2));margin-top:4px;line-height:1.4}
.ring{box-shadow:inset 0 0 0 1px rgb(var(--line)),inset 0 1px 0 rgb(var(--hi)/.06),var(--e1)}
[data-theme=light] .ring{box-shadow:inset 0 0 0 1px rgb(var(--line)),var(--e1)}
.strip{display:flex;align-items:center;gap:12px;padding:12px;border-radius:calc(var(--r-card)*var(--rs));background:rgb(var(--surface));margin-top:4px}
.strip .t{flex:1;min-width:0}.strip small{display:block;font-size:12px;color:rgb(var(--text2))}.strip b{display:block;font-size:clamp(16px,5cqw,18px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgb(var(--ok))}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tile{width:44px;height:44px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:23px;background:rgb(var(--tone,var(--teal))/.15);box-shadow:inset 0 0 0 1px rgb(var(--tone,var(--teal))/.42);color:rgb(var(--text))}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap;box-shadow:inset 0 0 0 1px rgb(var(--line-strong));color:rgb(var(--text2))}
.pill.gold{background:rgb(var(--gold));color:rgb(var(--on-gold));box-shadow:none}
.pill.out{color:rgb(var(--gold-ink));box-shadow:inset 0 0 0 1px rgb(var(--gold)/.7)}
.pill.best{background:rgb(var(--teal)/.16);color:rgb(var(--teal-ink));box-shadow:none}
.pill.rec{background:rgb(var(--gold)/.16);color:rgb(var(--gold-ink));box-shadow:none}
.btn{height:38px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:inset 0 0 0 1px rgb(var(--line-strong))}

/* --- BENTO --- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.full{grid-column:1/-1}
.card{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0;padding:14px 14px 12px;border-radius:calc(var(--r-card)*var(--rs));overflow:hidden;
 background:linear-gradient(160deg,rgb(var(--tone)/.2),rgb(var(--surface)) 64%);color:rgb(var(--text))}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.card .top>.i{font-size:20px;color:rgb(var(--text3));margin-top:2px}
.card h3{font-size:clamp(18px,5.6cqw,21px);font-weight:600;margin-top:10px;letter-spacing:-.2px}
.card p{font-size:13px;line-height:1.35;color:rgb(var(--text2));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;padding-top:10px;border-top:1px solid rgb(var(--line))}
.chips span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:rgb(var(--text2))}.chips .i{font-size:15px;color:rgb(var(--teal-ink))}
/* the one saturated card: Verify. Same in both themes = brand anchor */
.card.verify{--tone:var(--acc-a);color:#fff;background:linear-gradient(150deg,rgb(var(--acc-a)),rgb(var(--acc-b)) 58%,rgb(var(--acc-c)));box-shadow:inset 0 1px 0 rgb(255 255 255/.28),inset 0 0 0 1px rgb(255 255 255/.14),0 20px 36px -22px rgb(var(--acc-a)/.7)}
.card.verify:before{content:"";position:absolute;right:0;top:0;width:62%;height:48%;pointer-events:none;background:radial-gradient(rgb(255 255 255/.24) 1.2px,transparent 1.7px) 0 0/10px 10px;-webkit-mask:linear-gradient(to bottom left,#000,transparent 78%);mask:linear-gradient(to bottom left,#000,transparent 78%)}
.card.verify .tile{background:rgb(2 20 32/.55);box-shadow:inset 0 0 0 1px rgb(255 255 255/.2);color:#fff}
.card.verify p,.card.verify .chips span{color:rgb(255 255 255/.9)}.card.verify .chips{border-color:rgb(255 255 255/.2)}.card.verify .chips .i,.card.verify .top>.i{color:#fff}
.card.rent{--tone:34 170 225}.card.line{--tone:70 110 210}.card.net{--tone:242 120 40}.card.fwd{--tone:242 185 59}.card.ppl{--tone:120 150 175}
.card.line:after{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:rgb(var(--gold))}
.card.net .tile{color:#F26B1D}.card.fwd .tile{color:rgb(var(--gold-ink))}
.card.full.line .row2{display:flex;gap:14px;align-items:center}.card.full h3{margin-top:0}.card.full .row2 .tx{min-width:0}

/* --- FORM PARTS --- */
.seg{display:flex;padding:4px;gap:2px;border-radius:99px;background:rgb(var(--surface3));box-shadow:inset 0 0 0 1px rgb(var(--line))}
.seg button{flex:1;min-width:0;height:38px;padding:0 10px;border-radius:99px;font-size:15px;color:rgb(var(--text2));display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,rgb(var(--cta-a)),rgb(var(--cta-b)));color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgb(255 255 255/.25)}
.seg button[disabled]{opacity:.55;cursor:default}.seg.sm button{height:32px;padding:0 13px;font-size:14px;flex:none}
.banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:calc(var(--r-card)*var(--rs));background:linear-gradient(110deg,rgb(var(--teal)/.2),rgb(var(--surface)) 75%);position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgb(var(--teal-ink))}
.banner b{display:block;font-size:clamp(18px,5.6cqw,21px);font-weight:600}.banner small{font-size:14px;color:rgb(var(--text2));line-height:1.3;display:block}
.field{width:100%;display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:calc(var(--r-row)*var(--rs));background:rgb(var(--surface))}
.field .t{min-width:0;flex:1}.field b{display:block;font-size:17px;font-weight:500;line-height:1.2}.field small{display:block;font-size:13px;color:rgb(var(--text2));line-height:1.3}
.field>.i{font-size:20px;color:rgb(var(--text3))}.fl{width:48px;height:36px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-size:22px}
.stack{display:grid;gap:10px;margin-top:12px}
.step{display:flex;gap:12px;align-items:center;margin:20px 0 10px}.step .tile{width:36px;height:36px;border-radius:12px;font-size:19px}.step b{display:block;font-size:17px;font-weight:600}.step small{font-size:13px;color:rgb(var(--text2))}
.nrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 2px}.lbl{font-size:15px;color:rgb(var(--text2));font-weight:500}
.op{width:100%;display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;margin-top:10px;border-radius:calc(var(--r-row)*var(--rs));background:rgb(var(--surface));font-size:17px}
.op .i:first-child{font-size:22px;color:rgb(var(--teal-ink))}.op .pr{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}.op .chev{font-size:18px;color:rgb(var(--text3))}
.op.sel{background:rgb(var(--surface2));box-shadow:inset 0 0 0 1.5px rgb(var(--teal-ink)),0 0 20px -8px rgb(var(--teal)/.6)}
.op.auto{background:linear-gradient(90deg,rgb(var(--gold)/.24),rgb(var(--surface)) 88%);box-shadow:inset 0 0 0 1.5px rgb(var(--gold)),0 0 22px -10px rgb(var(--gold)/.6)}
.op.auto .i:first-child{color:rgb(var(--gold-ink))}.op.no{opacity:.45;cursor:not-allowed}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:calc(var(--r-row)*var(--rs));background:rgb(var(--surface));font-size:14px;line-height:1.4;color:rgb(var(--text2));margin-top:12px;width:100%}
.note>.i:first-child{font-size:20px;color:rgb(var(--teal-ink));margin-top:1px}.note.dash{background:none;box-shadow:inset 0 0 0 1px rgb(var(--line-strong));}.note.warn>.i:first-child{color:rgb(var(--warn))}
.note.lnk{align-items:center}.note.lnk b{display:block;color:rgb(var(--text));font-weight:600;font-size:15px}.note.lnk .chev{margin-left:auto;font-size:18px;color:rgb(var(--text3))}
.len{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.len button{height:52px;border-radius:99px;text-align:center;font-size:15px;box-shadow:inset 0 0 0 1px rgb(var(--line-strong))}
.len button.on{background:rgb(var(--surface));color:rgb(var(--teal-ink));font-weight:600;box-shadow:inset 0 0 0 2px rgb(var(--teal-ink))}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:18px}.chk i{width:26px;height:26px;border-radius:8px;background:rgb(var(--cta-b));display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.chk b{display:block;font-weight:500;font-size:16px}.chk small{color:rgb(var(--text2));font-size:13px}
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;margin-top:8px;border-radius:calc(var(--r-row)*var(--rs));background:rgb(var(--surface3));box-shadow:inset 0 0 0 1px rgb(var(--line))}
.search input{flex:1;min-width:0;height:100%;font-size:16px;outline:0}.search input::placeholder{color:rgb(var(--text3))}.search .i{font-size:21px;color:rgb(var(--text2))}
.spec{margin-top:14px;border-top:1px solid rgb(var(--line))}.spec div{display:flex;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid rgb(var(--line))}
.spec .i{font-size:24px;color:rgb(var(--teal-ink))}.spec small{display:block;font-size:12px;color:rgb(var(--text2))}.spec b{font-size:19px;font-weight:500}
.hero{display:flex;gap:14px;align-items:center;margin-top:12px}.thumb{width:clamp(76px,26cqw,100px);aspect-ratio:1;border-radius:22px;flex:none;background:linear-gradient(160deg,#6ab0e0,#c9a46a 58%,#7a5a3a)}.hero h2{font-size:clamp(19px,5.8cqw,23px);font-weight:600;line-height:1.2;margin-top:8px}
.back{display:flex;align-items:center;gap:6px;color:rgb(var(--text2));font-size:15px;padding:4px 0}

/* --- CTA + PRICE BAR --- */
.cta{width:100%;height:56px;border-radius:99px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;background:linear-gradient(180deg,rgb(var(--cta-a)),rgb(var(--cta-b)));box-shadow:inset 0 1px 0 rgb(255 255 255/.28),0 12px 24px -12px rgb(var(--teal)/.8)}
.cta.gold{color:rgb(var(--on-gold));background:linear-gradient(180deg,rgb(var(--gold)),rgb(var(--gold2)));box-shadow:inset 0 1px 0 rgb(255 255 255/.4),0 12px 24px -12px rgb(var(--gold2)/.8)}
.foot{flex:none;padding:12px 16px 26px;display:flex;flex-direction:column;gap:10px;background:rgb(var(--surface));box-shadow:inset 0 1px 0 rgb(var(--line))}
.pr2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;color:rgb(var(--text2));font-size:15px}.pr2 b{display:block;font-size:clamp(26px,8.4cqw,31px);font-weight:600;color:rgb(var(--text));line-height:1;font-variant-numeric:tabular-nums}.pr2 .r{text-align:right}.pr2 em{display:block;font-style:normal;font-size:13px;margin-top:4px}
.foot .note{margin:0;background:none;padding:0;font-size:13px}
.foot.row{flex-direction:row;align-items:center;gap:14px}.foot.row .cta{flex:1;height:52px;font-size:17px}

/* --- SHEET (modal | page) --- */
.scrim{position:absolute;inset:0;z-index:6;background:rgb(1 9 16/.62)}[data-theme=light] .scrim{background:rgb(10 36 49/.38)}
.sheet{position:absolute;inset:auto 0 0 0;max-height:calc(100% - 56px);height:calc(100% - 56px);z-index:7;display:flex;flex-direction:column;background:rgb(var(--surface2));border-radius:calc(var(--r-sheet)*var(--rs)) calc(var(--r-sheet)*var(--rs)) 0 0;box-shadow:inset 0 0 0 1px rgb(var(--line)),inset 0 1px 0 rgb(var(--hi)/.07),var(--e2);overflow:hidden}
.sheet.short{height:auto;max-height:calc(100% - 56px)}
.handle{width:42px;height:5px;border-radius:9px;background:rgb(var(--line-strong));margin:10px auto 0;flex:none}
.sh{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px 10px}.sh .t{min-width:0;flex:1}.sh b{display:block;font-size:clamp(20px,6.2cqw,23px);font-weight:600;line-height:1.1}.sh small{display:block;font-size:14px;color:rgb(var(--text2));margin-top:2px;line-height:1.3}
.sh .x,.sh .bk{font-size:26px;padding:6px;margin:-6px}.sh .bk{display:none;color:rgb(var(--teal-ink))}
[data-mode=page] .sheet{position:relative;height:auto;max-height:none;flex:1;border-radius:0;box-shadow:none;background:transparent}
[data-mode=page] .handle,[data-mode=page] .sh .x{display:none}[data-mode=page] .sh .bk{display:block}
[data-mode=page] .foot{background:rgb(var(--canvas));}

/* --- MORE --- */
.promo{border-radius:calc(var(--r-card)*var(--rs));padding:20px 16px;text-align:center;color:#fff;box-shadow:inset 0 0 0 1px rgb(var(--teal-ink)/.5),0 0 28px -12px rgb(var(--teal)/.8);background:radial-gradient(70% 120% at 50% 118%,rgb(var(--gold)/.5),transparent 62%),linear-gradient(150deg,rgb(var(--acc-b)),rgb(var(--acc-c)))}
.promo b{font-size:clamp(22px,7cqw,27px);font-weight:600;display:block}.promo small{font-size:14px;opacity:.9}
.list{margin-top:14px;border-radius:calc(var(--r-card)*var(--rs));background:rgb(var(--surface));overflow:hidden}
.mr{width:100%;display:flex;align-items:center;gap:14px;min-height:58px;padding:0 16px;font-size:18px;position:relative}.mr+.mr{box-shadow:inset 0 1px 0 rgb(var(--line))}
.mr .tile{width:36px;height:36px;border-radius:12px;font-size:20px;color:rgb(var(--teal-ink))}.mr .chev{margin-left:auto;font-size:18px;color:rgb(var(--text3))}.mr .st{margin-left:auto;font-size:20px;color:rgb(var(--gold));fill:currentColor}
.mr.on{background:rgb(var(--surface3))}.mr.on:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:rgb(var(--teal-ink))}
.list.g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:8px;background:none}
.list.g .mr{flex-direction:column;justify-content:center;gap:8px;min-height:88px;padding:8px 2px;font-size:13px;border-radius:calc(var(--r-row)*var(--rs));background:rgb(var(--surface));box-shadow:none;text-align:center}
.list.g .mr .chev,.list.g .mr .st{display:none}.list.g .mr.on:before{display:none}.list.g .mr.on{box-shadow:inset 0 0 0 1.5px rgb(var(--teal-ink))}
@container (max-width:340px){.card{padding:12px}.card p{font-size:12.5px}.nav button{font-size:11px}.op,.mr{font-size:16px}.step b{font-size:16px}.tile{width:40px;height:40px}}

<script>
const $=s=>document.querySelector(s),T=id=>document.getElementById('t-'+id).content.cloneNode(true);
const M={verify:['shield','Naara Verify','Secure your network. Verify your identity.'],rent:['hash','Rent a Number','Temporary number for calls, SMS and verification.'],line:['phone','Naara Line','Your permanent international number.']};
let cur='landing',mode='modal',lay='list';
function go(s){cur=s;document.querySelectorAll('#bar [data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));render()}
function render(){
 const st=$('#stage'),ap=$('#app');st.innerHTML='';ap.dataset.mode=mode;
 const flow=M[cur],more=cur==='more';
 if(flow&&mode==='page'){/* dedicated page: no landing underneath */}
 else if(flow||more){st.appendChild(T(window.UNDER||'landing'));const sc=document.createElement('div');sc.className='scrim';sc.onclick=()=>go(window.UNDER||'landing');st.appendChild(sc)}
 if(flow||more){
  const sh=document.createElement('div');sh.className='sheet'+(more?' short':'');

  else{const[ic,t,s]=flow;sh.innerHTML=`<div class="handle"></div><div class="sh"><button class="bk" aria-label="Back"><svg class="i"><use href="#left"/></svg></button><span class="tile"><svg class="i"><use href="#${ic}"/></svg></span><div class="t"><b>${t}</b><small>${s}</small></div><button class="x" aria-label="Close"><svg class="i"><use href="#x"/></svg></button></div>`}
  sh.appendChild(T(cur));st.appendChild(sh);
  sh.querySelectorAll('.x,.bk').forEach(b=>b.onclick=()=>go(window.UNDER||'landing'));
  if(more){$('#ml').classList.toggle('g',lay==='grid');sh.querySelectorAll('#lseg button').forEach(b=>{b.classList.toggle('on',b.dataset.l===lay);b.onclick=()=>{lay=b.dataset.l;render()}})}
 }else st.appendChild(T(cur));
 st.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 st.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{st.querySelectorAll('[data-op]').forEach(r=>r.classList.remove('sel'));if(!b.classList.contains('auto'))b.classList.add('sel')});
 st.querySelectorAll('.seg:not(#lseg) button:not([disabled])').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  if(b.parentNode.id==='ps'){const stat=b.textContent==='Statistics';st.querySelectorAll('.pr[data-p]').forEach(p=>p.textContent=stat?p.dataset.s:p.dataset.p)}});
 const len=st.querySelector('#len');if(len){const P=[['$8.50','(1 week rental)'],['$24.00','(1 month rental)'],['$61.00','(3 months rental)']];len.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{len.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#rp').textContent=P[i][0];$('#rl').textContent=P[i][1]})}
}
document.querySelectorAll('#bar [data-s]').forEach(b=>b.onclick=()=>go(b.dataset.s));
$('#th').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'};
$('#md').onclick=e=>{mode=mode==='modal'?'page':'modal';e.target.textContent='Flows: '+(mode==='modal'?'Modal':'Dedicated page');render()};
$('#midb').onclick=()=>go('more');
document.addEventListener('keydown',e=>{if(e.key==='Escape')go(window.UNDER||'landing')});
render();
/* ===== Appearance engine: per-account prefs, admin governance ===== */
M.quick=['grid','Appearance','Only for your account'];
const SK={surface:['Naara Surface','Layered depth with one bold action card.','Core'],calm:['Calm','Flat and tonal. The quietest option.','Core'],vivid:['Vivid','Saturated gradient cards and solid accent rows.','Core'],ledger:['Ledger','Flat statement look: hairlines, left tone bars, dashed rules.','Core'],daybreak:['Daybreak','Light-first pastel wash, soft shadows, round tiles.','Soft'],paper:['Paper','Warm editorial paper, serif headings, stamp pills.','Soft'],clay:['Clay','Soft inflated 3D cards and pressed inputs.','Soft'],dotgrid:['Dot-grid','Two-scale dot lattice fading from each card corner.','Textured'],aurora:['Aurora','Glow, orbit rings and a signature motif per card.','Textured'],glass:['Glass','Frosted translucent layers over a soft colour mesh.','Material'],halo:['Halo','Glowing gradient borders that slowly orbit each card.','Material'],neo:['Neo','Bold outlines and hard offset shadows.','Bold'],noir:['Noir','True-black OLED, hairlines, accent only where it counts.','Bold']};
const AC={teal:'Naara Teal',ocean:'Ocean',violet:'Violet',emerald:'Emerald',rose:'Rose',graphite:'Graphite'};
const ACCTS={a:'Frank',b:'Amaka',c:'Guest'},DEF={skin:'surface',accent:'teal',mode:'dark'},SEED={a:{skin:"surface",accent:"teal",mode:"dark"},b:{skin:"glass",accent:"violet",mode:"light"}};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const mini=k=>`<span class="mini" data-skin="${k}"><span class="grid"><span class="card verify"><span class="tile">${ic('shield')}</span><h3>Verify</h3></span><span class="card rent ring"><span class="tile">${ic('hash')}</span><h3>Rent</h3></span></span></span>`;
function fill(){
 apply();const p=eff(),L=locked(),dis=L?'disabled':'';

 document.querySelectorAll('.js-skins').forEach(e=>{let g='';e.innerHTML=Object.keys(SK).filter(k=>admin.skins[k]).map(k=>{const h=SK[k][2]!==g?(g=SK[k][2],`<span class="grp">${g}</span>`):'';return h+`<button class="skc ${p.skin===k?'sel':''}" data-k="skin" data-v="${k}" ${dis}><span class="hd"><span><b>${SK[k][0]}</b><small>${SK[k][1]}</small></span>${k===admin.def.skin?'<span class="pill best">Default</span>':''}<span class="ck">${ic('check')}</span></span>${mini(k)}</button>`}).join('')});
 document.querySelectorAll('.js-skinseg').forEach(e=>e.innerHTML=Object.keys(SK).filter(k=>admin.skins[k]).map(k=>`<button data-k="skin" data-v="${k}" class="${p.skin===k?'on':''}" ${dis}>${SK[k][0].replace('Naara ','')}</button>`).join(''));
 document.querySelectorAll('.js-accs').forEach(e=>e.innerHTML=Object.keys(AC).filter(k=>admin.accents[k]).map(k=>`<button class="swb ${p.accent===k?'sel':''}" data-k="accent" data-v="${k}" data-accent="${k}" ${dis}><i></i><span>${AC[k]}</span></button>`).join(''));
 const ad=document.querySelector('.js-admin');if(ad){const row=(a,v,n,on)=>`<button class="op ring" data-a="${a}" data-v="${v}"><span>${n}</span><span class="tg ${on?'on':''}"><i></i></span></button>`;
  ad.innerHTML=`<div class="lbl">Platform default skin</div><div class="seg wrapseg" style="margin-top:8px">${Object.keys(SK).map(k=>`<button data-a="defskin" data-v="${k}" class="${admin.def.skin===k?'on':''}">${SK[k][0].replace('Naara ','')}</button>`).join('')}</div>
